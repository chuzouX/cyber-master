# Cyber Master 全局配置（首次启动自动生成）

[ui]
theme = "cyberpunk"          # catppuccin | tokyo-night | dracula | gruvbox | nord | cyberpunk
default_mode = "chat"        # chat | workflow | dashboard
animations = true
mouse = true
frame_rate = 60

[agent]
default_provider = "openai"  # 见 providers.toml
auto_tool_call = true
max_steps = 25               # agent loop 最大步数
retry_attempts = 5           # 模型异常重连次数（中断、连接超时等，默认 5 次）
retry_delay_secs = 3         # 重试时间间隔（秒，默认 3 秒）

[agent.subagents]
enabled = true
max_tasks = 8
max_parallel = 4
timeout_secs = 300
max_steps = 25

[agent.vision]
enabled = true
provider = "deepseek"
model = "deepseek-flash"
prompt = "请详细分析并描述此图片内容，提取其中的文本、界面元素与安全关键信息。"
detail = "auto"

[workflow]
max_parallel_nodes = 8
default_timeout_secs = 1800
checkpoint = true            # 启用断点续跑

[tools]
prefer_docker = false        # 工具缺失时是否用 docker 镜像兜底
extra_path = []              # 额外工具路径
web_search = true              # 是否启用联网搜索与网页抓取（web_fetch）

[storage]
history_retention_days = 90
log_level = "info"
